# ─────────────────────────────────────────────────────────────
# xChanger — Producción
# Servicios: PostgreSQL 15 · Backend (Express+Socket.io) · Frontend (Astro SSR) · Nginx
#
# Variables requeridas en .env (raíz del proyecto):
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#
# Variables requeridas en backend/.env:
#   JWT_ACCESS_SECRET, JWT_REFRESH_SECRET,
#   SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS, SMTP_FROM
#   (DATABASE_URL, DIRECT_URL, FRONTEND_URL, NODE_ENV y PORT se sobreescriben aquí)
#
# Arranque: docker-compose up -d --build
# ─────────────────────────────────────────────────────────────

services:
  # ── Base de datos ────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: xchanger_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - xchanger_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend (Express + Socket.io) ────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xchanger_backend
    restart: unless-stopped
    # env_file aporta JWT_* y SMTP_*; environment sobreescribe las URLs y el entorno
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      DIRECT_URL:   "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      FRONTEND_URL: "http://9.160.161.200"
    # Ejecuta migraciones pendientes y arranca el servidor
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - xchanger_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend (Astro SSR) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # PUBLIC_API_URL se bake en el bundle del navegador en tiempo de build
        PUBLIC_API_URL: "http://9.160.161.200"
        # API_URL se inlinea en el bundle SSR; apunta al backend interno
        API_URL: "http://backend:3000"
    container_name: xchanger_frontend
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - xchanger_net

  # ── Nginx (reverse proxy) ─────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: xchanger_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - xchanger_net

# ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

networks:
  xchanger_net:
    driver: bridge
