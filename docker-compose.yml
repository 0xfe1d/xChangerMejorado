# ─────────────────────────────────────────────────────────────
# xChanger — Producción
# Servicios: PostgreSQL 15 · Backend (Express+Socket.io) · Frontend (Astro SSR) · Nginx
#
# Variables requeridas en .env (raíz del proyecto):
#   APP_URL          → URL completa, ej: https://xchanger-uc.xyz  o  http://localhost
#   APP_HOST         → Solo el hostname, ej: xchanger-uc.xyz      o  localhost
#   ENABLE_HTTPS     → true (HTTPS con Let's Encrypt) | false (HTTP puro)
#   COOKIE_SECURE    → true si APP_URL usa https://, false en localhost
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
#   MFA_KEK          → clave de cifrado de los secretos TOTP (openssl rand -hex 32)
#   MFA_REQUIRE_HTTPS→ true en producción; false solo para probar en http://localhost
#
# Variables requeridas en backend/.env:
#   JWT_ACCESS_SECRET, JWT_REFRESH_SECRET, JWT_CHANNEL_SECRET,
#   SERVICE_JWT_PRIVATE_KEY, SERVICE_JWT_KID, SERVICE_CLIENTS (escalado §12.3),
#   SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_PASS, SMTP_FROM
#   (DATABASE_URL, DIRECT_URL, FRONTEND_URL, NODE_ENV y PORT se sobreescriben aquí)
#
# Arranque: docker-compose up -d --build
# ─────────────────────────────────────────────────────────────

services:
  # ── Base de datos ────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: xchanger_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - xchanger_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Redis (bus de eventos, límites, idempotencia, sockets) ──
  # Escalado §12.1: AOF activado y sin puerto publicado
  redis:
    image: redis:7-alpine
    container_name: xchanger_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - xchanger_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Base de datos del bot (Escalado §12.1) ───────────────────
  bot-db:
    image: postgres:15-alpine
    container_name: xchanger_bot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER:     "${BOT_POSTGRES_USER:-xchanger_bot}"
      POSTGRES_PASSWORD: "${BOT_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}"
      POSTGRES_DB:       "${BOT_POSTGRES_DB:-xchanger_bot}"
    volumes:
      - bot_db_data:/var/lib/postgresql/data
    networks:
      - xchanger_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${BOT_POSTGRES_USER:-xchanger_bot} -d ${BOT_POSTGRES_DB:-xchanger_bot}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Backend (Express + Socket.io) ────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: xchanger_backend
    restart: unless-stopped
    # env_file aporta JWT_* y SMTP_*; environment sobreescribe las URLs y el entorno
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      DIRECT_URL:   "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable"
      FRONTEND_URL: "${APP_URL}"
      COOKIE_SECURE: "${COOKIE_SECURE}"
      REDIS_URL: "redis://redis:6379/0"
      # Página de aprobación de vinculaciones del bot (EP-C-04/05)
      CHANNEL_LINK_BASE_URL: "${APP_URL}/vincular"
      MFA_SERVICE_URL: "http://mfa:8081"
      MFA_REQUIRE_HTTPS: "${MFA_REQUIRE_HTTPS:-true}"
    # AR-02: el puerto 3000 ya NO se publica; solo Nginx es accesible desde fuera
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - xchanger_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 60s

  # ── mfa-service (TOTP RFC 6238, compatible con Microsoft Authenticator) ──
  # Sin puerto publicado: solo lo llama el backend por la red interna, con JWT
  # de servicio que valida contra el JWKS del core. Guarda sus datos en el
  # esquema "mfa" de la misma instancia de PostgreSQL.
  mfa:
    build:
      context: ./mfa-service
      dockerfile: Dockerfile
    container_name: xchanger_mfa
    restart: unless-stopped
    environment:
      PORT: "8081"
      PGHOST: db
      PGPORT: "5432"
      PGUSER: "${POSTGRES_USER}"
      PGPASSWORD: "${POSTGRES_PASSWORD}"
      PGDATABASE: "${POSTGRES_DB}"
      MFA_KEK: "${MFA_KEK}"
      MFA_ISSUER: "xChanger"
      CORE_JWKS_URL: "http://backend:3000/api/v1/internal/.well-known/jwks.json"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - xchanger_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Frontend (Astro SSR) ──────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # PUBLIC_API_URL se bake en el bundle del navegador en tiempo de build
        PUBLIC_API_URL: "${APP_URL}"
        # API_URL apunta al backend interno (no cambia entre entornos)
        API_URL: "http://backend:3000"
    container_name: xchanger_frontend
    restart: unless-stopped
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      NODE_ENV: production
      # El SSR lee API_URL en runtime (process.env); sin ella cae en PUBLIC_API_URL
      # (http://localhost), que dentro del contenedor no apunta al backend
      API_URL: "http://backend:3000"
    depends_on:
      - backend
    networks:
      - xchanger_net

  # ── Microservicio Telegram Bot (Escalado §12.1) ──────────────
  telegram-bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: xchanger_telegram_bot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8080"
      USE_MOCK_CORE: "${TG_USE_MOCK_CORE:-false}"
      CORE_API_URL: "${CORE_API_URL:-http://backend:3000/api/v1}"
      REDIS_URL: "redis://redis:6379/0"
      BOT_DATABASE_URL: "postgresql://${BOT_POSTGRES_USER:-xchanger_bot}:${BOT_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD}}@bot-db:5432/${BOT_POSTGRES_DB:-xchanger_bot}?sslmode=disable"
      SERVICE_CLIENT_ID: "${SERVICE_CLIENT_ID:-telegram-bot}"
      SERVICE_CLIENT_SECRET: "${SERVICE_CLIENT_SECRET:-}"
      TOKEN_ENC_KEY: "${TOKEN_ENC_KEY:-}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_BOT_MODE: "${TELEGRAM_BOT_MODE:-webhook}"
      TELEGRAM_WEBHOOK_URL: "${TELEGRAM_WEBHOOK_URL:-${APP_URL:-https://xchanger-uc.xyz}/telegram/webhook}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET:-dev-webhook-secret}"
    depends_on:
      bot-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - xchanger_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Nginx (reverse proxy) ─────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: xchanger_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/http.conf.template:/etc/nginx/templates/http.conf.template:ro
      - ./nginx/https.conf.template:/etc/nginx/templates/https.conf.template:ro
      - ./nginx/docker-entrypoint.sh:/docker-entrypoint-xchanger.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    environment:
      NGINX_HOST: "${APP_HOST}"
      ENABLE_HTTPS: "${ENABLE_HTTPS:-false}"
    entrypoint: ["/bin/sh", "/docker-entrypoint-xchanger.sh"]
    depends_on:
      - frontend
      - backend
      - telegram-bot
    networks:
      - xchanger_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # ── Certbot (Let's Encrypt) ───────────────────────────────────
  # Obtiene el cert la primera vez y lo renueva cada 12h automáticamente.
  # Solo actúa si ENABLE_HTTPS=true; si es false, el comando sale inmediatamente.
  certbot:
    image: certbot/certbot:latest
    container_name: xchanger_certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    environment:
      APP_HOST: "${APP_HOST}"
      CERTBOT_EMAIL: "${CERTBOT_EMAIL}"
      ENABLE_HTTPS: "${ENABLE_HTTPS:-false}"
    entrypoint: >
      sh -c "
        if [ \"$$ENABLE_HTTPS\" != 'true' ]; then
          echo '[certbot] ENABLE_HTTPS no es true, saliendo.';
          exit 0;
        fi;
        certbot certonly --webroot --webroot-path=/var/www/certbot
          -d $$APP_HOST
          --email $$CERTBOT_EMAIL
          --agree-tos --non-interactive --keep-until-expiring
          && echo '[certbot] Certificado obtenido/verificado.';
        while true; do
          sleep 12h;
          certbot renew --quiet;
        done
      "
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - xchanger_net

# ─────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  bot_db_data:
    driver: local
  redis_data:
    driver: local
  letsencrypt:
    driver: local
  certbot_webroot:
    driver: local

networks:
  xchanger_net:
    driver: bridge
