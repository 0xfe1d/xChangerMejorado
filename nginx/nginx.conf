events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Tamaño máximo de cuerpo de petición (ajustar si hay subida de ficheros)
    client_max_body_size 10M;

    upstream backend {
        server backend:3000;
    }

    upstream frontend {
        server frontend:4321;
    }

    # Los bloques server se generan en tiempo de arranque a partir de la plantilla
    # seleccionada según ENABLE_HTTPS (ver nginx/docker-entrypoint.sh)
    include /etc/nginx/conf.d/*.conf;
}
