events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Tamaño máximo de cuerpo de petición (ajustar si hay subida de ficheros)
    client_max_body_size 10M;

    upstream backend {
        server backend:3000;
    }

    upstream frontend {
        server frontend:4321;
    }

    server {
        listen 80;
        server_name 9.160.161.200;

        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log warn;

        # ── API REST ──────────────────────────────────────────────
        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Socket.io (requiere upgrade a WebSocket) ──────────────
        location /socket.io/ {
            proxy_pass             http://backend;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade           $http_upgrade;
            proxy_set_header       Connection        "upgrade";
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            # Tiempo alto para mantener conexiones WebSocket abiertas
            proxy_read_timeout     86400s;
        }

        # ── Frontend (Astro SSR) ─────────────────────────────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # ── HTTPS (descomenta cuando tengas certificados SSL) ─────────
    # Para obtener certificados gratuitos usa Certbot + Let's Encrypt.
    # Guía: https://certbot.eff.org/instructions?ws=nginx&os=snap
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name 9.160.161.200;   # Sustituir por tu dominio si tienes uno
    #
    #     ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         HIGH:!aNULL:!MD5;
    #
    #     location /api/       { ... }
    #     location /socket.io/ { ... }
    #     location /           { ... }
    # }
    #
    # # Redirigir HTTP → HTTPS
    # server {
    #     listen 80;
    #     server_name tu-dominio.com;
    #     return 301 https://$host$request_uri;
    # }
}
